<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Baca Artikel | InuuTyzDev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 antialiased min-w-[1280px] overflow-x-auto pt-24">

    <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
        <div class="flex justify-between items-center py-5 px-16 max-w-7xl mx-auto">
            <div class="text-2xl font-black tracking-tighter text-gray-950">Dn</div>
            <div class="flex items-center space-x-10 text-sm font-semibold text-gray-500">
                <a href="index.html" class="hover:text-gray-950 transition">Beranda</a>
                <a href="blog.html" class="hover:text-gray-950 transition font-bold">Blog</a>
            </div>
            <a href="kontak.html" class="bg-gray-950 text-white px-7 py-3 rounded-full text-xs font-bold transition">Hubungi Saya</a>
        </div>
    </nav>

    <main id="root-artikel" class="max-w-4xl mx-auto px-16 py-16">
        <div class="animate-pulse flex flex-col items-center">
             <div class="h-4 w-20 bg-gray-100 mb-4"></div>
             <div class="h-12 w-3/4 bg-gray-100 mb-10"></div>
             <div class="h-80 w-full bg-gray-100 rounded-[40px]"></div>
        </div>
    </main>

    <div class="text-center pb-32">
        <a href="blog.html" class="inline-flex items-center space-x-3 bg-gray-950 text-white px-10 py-4 rounded-full font-bold hover:bg-gray-800 transition">
            <i class="fas fa-arrow-left"></i>
            <span>Kembali ke Blog</span>
        </a>
    </div>

    <script src="database-blog.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const post = databaseBlog.find(p => p.id === id);
        const root = document.getElementById('root-artikel');

        if (post) {
            root.innerHTML = `
                <div class="text-center mb-16">
                    <span class="text-[10px] font-black text-gray-400 uppercase tracking-[0.3em]">${post.kategori}</span>
                    <h1 class="text-5xl md:text-6xl font-black text-gray-900 mt-6 mb-8 leading-tight">${post.judulArtikel}</h1>
                    <div class="flex justify-center items-center space-x-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                        <span>Oleh Danendra N Rs</span>
                        <span class="text-gray-200">|</span>
                        <span>${post.tanggal}</span>
                        <span class="text-gray-200">|</span>
                        <span>${post.durasi}</span>
                    </div>
                </div>

                <div style="background-color: ${post.warna}" class="w-full h-96 rounded-[50px] flex items-center justify-center p-16 shadow-2xl mb-20 text-center">
                    <h2 class="text-4xl md:text-5xl font-black text-white leading-tight shadow-sm">${post.judulBanner}</h2>
                </div>

                <article class="prose prose-lg max-w-none text-gray-600 leading-relaxed">
                    <p class="text-xl mb-8 font-medium text-gray-800">${post.deskripsi}</p>
                    <div class="space-y-6">
                        ${post.isi}
                    </div>
                </article>

                <div class="mt-24 pt-10 border-t border-gray-100 flex justify-between items-center">
                    <span class="text-sm font-bold text-gray-900 uppercase tracking-widest">Bagikan Artikel</span>
                    <div class="flex space-x-6 text-gray-400">
                        <a href="#" class="hover:text-gray-950 transition text-xl"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="hover:text-gray-950 transition text-xl"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="hover:text-gray-950 transition text-xl"><i class="fab fa-linkedin-in"></i></a>
                        <a href="#" class="hover:text-gray-950 transition text-xl"><i class="fas fa-link"></i></a>
                    </div>
                </div>
            `;
            // Mengubah judul halaman browser sesuai judul artikel
            document.title = `${post.judulArtikel} | InuuTyzDev`;
        } else {
            root.innerHTML = `<h1 class="text-center text-3xl font-bold py-20">Artikel tidak ditemukan.</h1>`;
        }
    </script>
</body>
</html>
