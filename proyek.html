<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Semua Proyek | InuuTyzDev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 antialiased min-w-[1280px] overflow-x-auto pt-24">

    <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
        <div class="flex justify-between items-center py-5 px-16 max-w-7xl mx-auto">
            <div class="text-2xl font-black tracking-tighter text-gray-950">Developer Modal Ai</div>
            <div class="flex items-center space-x-10 text-sm font-semibold text-gray-500">
                <a href="index.html" class="hover:text-gray-950 transition">Beranda</a>
                <a href="tentang.html" class="hover:text-gray-950 transition">Tentang</a>
                <a href="proyek.html" class="text-gray-950 transition font-bold">Proyek</a>
                <a href="blog.html" class="hover:text-gray-950 transition">Blog</a>
            </div>
            <a href="kontak.html" class="bg-gray-950 text-white px-7 py-3 rounded-full text-xs font-bold hover:bg-gray-800 transition shadow-sm">
                Hubungi Saya
            </a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-16 pt-16 pb-12 text-center">
        <h1 class="text-5xl font-black text-gray-900 mb-4">Semua Proyek</h1>
        <p class="text-gray-500">Berikut adalah kumpulan proyek yang pernah saya handle.</p>
    </div>

    <div class="max-w-7xl mx-auto px-16 mb-12 flex justify-between items-center">
        <div class="relative w-96">
            <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchProyek" placeholder="Cari proyek..." class="w-full pl-12 pr-4 py-3 rounded-full border border-gray-200 focus:outline-none focus:border-gray-950 text-sm">
        </div>
        <div class="flex space-x-2">
            <button class="bg-gray-950 text-white px-6 py-2 rounded-full text-sm font-semibold">Semua</button>
            <button class="text-gray-500 hover:text-gray-950 px-6 py-2 rounded-full text-sm font-semibold transition">Website</button>
            <button class="text-gray-500 hover:text-gray-950 px-6 py-2 rounded-full text-sm font-semibold transition">Mobile App</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-16 pb-32">
        <div id="grid-proyek" class="grid grid-cols-3 gap-10">
            </div>
    </div>

    <script src="database-proyek.js"></script>
    
    <script>
        const gridContainer = document.getElementById('grid-proyek');

        function renderProyek() {
            // Memastikan data terambil dari database-proyek.js
            databaseProyek.forEach(proyek => {
                const card = `
                    <div class="bg-white p-6 rounded-[40px] border border-gray-100 shadow-sm hover:shadow-2xl transition-all duration-500 group">
                        <div class="bg-gray-100 rounded-[24px] overflow-hidden aspect-[4/3] mb-8 relative border border-gray-50">
                            <div class="absolute top-0 left-0 w-full bg-white h-8 flex items-center px-4 space-x-1.5 border-b border-gray-100 z-10">
                                <div class="w-2 h-2 rounded-full bg-red-400"></div>
                                <div class="w-2 h-2 rounded-full bg-yellow-400"></div>
                                <div class="w-2 h-2 rounded-full bg-green-400"></div>
                            </div>
                            <img src="${proyek.gambar}" alt="${proyek.nama}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-105 transition duration-700">
                        </div>
                        <div class="px-2">
                            <h3 class="text-2xl font-bold text-gray-900">${proyek.nama}</h3>
                            <p class="text-gray-400 text-sm mt-3 mb-8 leading-relaxed">${proyek.layanan}</p>
                            <a href="detail-proyek.html?id=${proyek.id}" class="inline-flex items-center space-x-3 text-[10px] font-black uppercase tracking-widest text-gray-950 group-hover:translate-x-2 transition-transform">
                                <span>Lihat Detail</span>
                                <i class="fas fa-chevron-right text-[8px]"></i>
                            </a>
                        </div>
                    </div>
                `;
                gridContainer.innerHTML += card;
            });
        }

        // Jalankan fungsi saat halaman dimuat
        renderProyek();
    </script>
</body>
</html>
