<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APKMODY Downloader</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .search-form { display: flex; gap: 8px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1; padding: 12px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 15px; outline: none;
        }
        input[type="text"]:focus { border-color: var(--primary); }
        button {
            padding: 12px 20px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        button:hover { background: var(--primary-dark); }
        .section-title { font-size: 18px; margin-bottom: 12px; font-weight: bold; }
        .loading { text-align: center; display: none; margin: 20px 0; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card {
            background: var(--card); border-radius: 10px; overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column;
        }
        .card img { width: 100%; height: 120px; object-fit: cover; background: #e5e7eb; }
        .card-content { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        .card-version { font-size: 12px; color: #6b7280; margin-bottom: 10px; flex: 1; }
        
        .detail-card {
            display: none; background: var(--card); padding: 20px;
            border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .detail-header { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; }
        .detail-header img { width: 75px; height: 75px; border-radius: 12px; background: #e5e7eb; }
        .desc-box { background: #f9fafb; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 15px; color: #4b5563; }
        
        .screenshots { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        .screenshots img { height: 140px; border-radius: 6px; object-fit: cover; }
        
        .dl-item {
            background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px;
            border-radius: 6px; margin-bottom: 8px; display: flex;
            justify-content: space-between; align-items: center; gap: 10px;
        }
        .btn-dl {
            background: var(--primary); color: white; padding: 8px 14px;
            border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; white-space: nowrap;
        }
        .btn-back { background: #6b7280; margin-bottom: 15px; }
        .error { color: #dc2626; background: #fee2e2; padding: 12px; border-radius: 6px; display: none; margin-bottom: 15px; }
        .placeholder { display: flex; align-items: center; justify-content: center; background: #e5e7eb; color: #9ca3af; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>APKMODY Downloader</h1>

    <div class="search-form">
        <input type="text" id="searchInput" placeholder="Cari aplikasi/game...">
        <button onclick="handleSearch()">Cari</button>
    </div>

    <div class="error" id="error"></div>
    <div class="loading" id="loading">Memuat data...</div>

    <!-- Halaman Utama / Hasil Search -->
    <div id="mainView">
        <div class="section-title" id="gridTitle">Rekomendasi / Terbaru</div>
        <div class="grid" id="results"></div>
    </div>

    <!-- Detail View -->
    <div class="detail-card" id="detail">
        <button class="btn-back" onclick="showMainView()">⬅ Kembali</button>
        <div class="detail-header" id="detailHeader"></div>
        
        <div class="section-title">Deskripsi</div>
        <div class="desc-box" id="detailDesc"></div>

        <div class="section-title" id="ssTitle">Screenshot</div>
        <div class="screenshots" id="detailScreenshots"></div>

        <div class="section-title">Daftar File Download</div>
        <div id="downloadList"></div>
    </div>
</div>

<script>
    const PLACEHOLDER = 'https://via.placeholder.com/300x150?text=No+Image';

    window.onload = () => {
        loadHome();
    };

    async function loadHome() {
        showLoading(true);
        try {
            const res = await fetch('/api/apkmody?action=home');
            const data = await res.json();
            document.getElementById('gridTitle').textContent = 'Rekomendasi / Terbaru';
            renderGrid(data.items || []);
        } catch (err) {
            showError('Gagal memuat halaman utama');
        } finally {
            showLoading(false);
        }
    }

    async function handleSearch() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return loadHome();

        showLoading(true);
        hideError();
        hideDetail();

        try {
            if (query.startsWith('http')) {
                await loadDetail(query);
            } else {
                const res = await fetch(`/api/apkmody?action=search&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                document.getElementById('gridTitle').textContent = `Hasil Pencarian: "${query}"`;
                renderGrid(data.items || []);
            }
        } catch (err) {
            showError(err.message);
        } finally {
            showLoading(false);
        }
    }

    function renderGrid(items) {
        const container = document.getElementById('results');
        container.innerHTML = '';
        
        if (items.length === 0) {
            container.innerHTML = '<p>Tidak ada data ditemukan.</p>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            const imgSrc = item.cover || PLACEHOLDER;
            card.innerHTML = `
                <img src="${imgSrc}" onerror="this.src='${PLACEHOLDER}'" alt="cover">
                <div class="card-content">
                    <div class="card-title">${item.title}</div>
                    <div class="card-version">${item.version || ''}</div>
                    <button onclick="loadDetail('${item.url}')">Detail & Download</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function loadDetail(url) {
        showLoading(true);
        hideError();
        try {
            const res = await fetch(`/api/apkmody?action=detail&url=${encodeURIComponent(url)}`);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Gagal memuat detail');

            document.getElementById('mainView').style.display = 'none';
            document.getElementById('detail').style.display = 'block';

            document.getElementById('detailHeader').innerHTML = `
                <img src="${data.icon || PLACEHOLDER}" onerror="this.src='${PLACEHOLDER}'" alt="icon">
                <div>
                    <h2 style="margin:0 0 5px 0; font-size:18px;">${data.title}</h2>
                    <div style="font-size:13px; color:#6b7280;">
                        ${data.version ? `<strong>Versi:</strong> ${data.version}<br>` : ''}
                        ${data.mod ? `<strong>Mod:</strong> ${data.mod}` : ''}
                    </div>
                </div>
            `;

            document.getElementById('detailDesc').textContent = data.description;

            const ssContainer = document.getElementById('detailScreenshots');
            ssContainer.innerHTML = '';
            if (data.screenshots && data.screenshots.length > 0) {
                document.getElementById('ssTitle').style.display = 'block';
                data.screenshots.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.onerror = () => img.remove();
                    ssContainer.appendChild(img);
                });
            } else {
                document.getElementById('ssTitle').style.display = 'none';
            }

            const dlContainer = document.getElementById('downloadList');
            dlContainer.innerHTML = '';
            if (!data.downloads || data.downloads.length === 0) {
                dlContainer.innerHTML = '<p style="color:red;">File download tidak ditemukan.</p>';
            } else {
                data.downloads.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'dl-item';
                    item.innerHTML = `
                        <div style="overflow:hidden;">
                            <strong style="font-size:14px; word-break:break-all;">${file.fileName}</strong><br>
                            <small style="color:#6b7280;">Ukuran: ${file.size}</small>
                        </div>
                        <a href="${file.url}" target="_blank" class="btn-dl">Unduh</a>
                    `;
                    dlContainer.appendChild(item);
                });
            }
        } catch (err) {
            showError(err.message);
        } finally {
            showLoading(false);
        }
    }

    function showLoading(v) { document.getElementById('loading').style.display = v ? 'block' : 'none'; }
    function showError(msg) {
        const e = document.getElementById('error');
        e.style.display = 'block';
        e.textContent = msg;
    }
    function hideError() { document.getElementById('error').style.display = 'none'; }
    function hideDetail() { document.getElementById('detail').style.display = 'none'; }
    function showMainView() {
        document.getElementById('detail').style.display = 'none';
        document.getElementById('mainView').style.display = 'block';
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSearch();
    });
</script>

</body>
</html>
