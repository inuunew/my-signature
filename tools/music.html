<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Search - InuuTyzDev</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-purple: #8A2BE2;
            --secondary-purple: #4c1d95;
            --accent-cyan: #00f3ff;
            --glass-bg: rgba(20, 20, 30, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --nav-height: 70px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: #050505;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #1a0b2e 0%, #000 60%);
            background-size: 200% 200%;
            animation: bgPulse 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes bgPulse {
            0% { background-position: 50% 0%; }
            50% { background-position: 50% 20%; }
            100% { background-position: 50% 0%; }
        }

        .app-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            color: white;
            background: rgba(10, 10, 15, 0.95);
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .app-container {
                width: 400px;
                height: 85vh;
                max-height: 900px;
                border-radius: 30px;
                border: 1px solid rgba(255, 255, 255, 0.15);
                box-shadow: 0 0 50px rgba(138, 43, 226, 0.3);
            }
            .main-content::-webkit-scrollbar { width: 5px; }
            .main-content::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anim-element {
            opacity: 0;
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }

        header {
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 50;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.3);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 20px 150px 20px;
            position: relative;
        }

        .glass-card {
            background: rgba(30, 30, 45, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .input-group {
            position: relative;
            display: flex;
            gap: 8px;
        }
        .input-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px 15px;
            color: #fff;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .input-box:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
        }
        .search-btn {
            width: 48px;
            background: var(--primary-purple);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .search-btn:active { transform: scale(0.95); opacity: 0.8; }

        .song-list { display: flex; flex-direction: column; gap: 12px; }
        .song-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 12px;
            transition: 0.2s;
            cursor: pointer;
            position: relative;
        }
        .song-item:active { background: rgba(255, 255, 255, 0.08); transform: scale(0.98); }

        .song-img {
            width: 45px; height: 45px; border-radius: 8px; object-fit: cover; margin-right: 12px;
        }
        .song-info { flex: 1; overflow: hidden; }
        .song-title {
            font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff;
        }
        .song-artist {
            font-size: 0.75rem; color: #aaa; font-family: 'Courier Prime', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* MINI PLAYER */
        .mini-player {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(150px);
            width: 90%; background: rgba(20, 10, 30, 0.95); backdrop-filter: blur(15px);
            border: 1px solid var(--primary-purple); border-radius: 50px; padding: 8px 20px 8px 8px;
            display: flex; align-items: center; z-index: 90;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; visibility: hidden;
        }
        .mini-player.active { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }

        .mp-img {
            width: 42px; height: 42px; border-radius: 50%; object-fit: cover;
            animation: spin 5s linear infinite; animation-play-state: paused; border: 2px solid var(--accent-cyan);
        }
        .mp-img.playing { animation-play-state: running; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .mp-info { flex: 1; padding: 0 15px; overflow: hidden; }
        .mp-title { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mp-artist { font-size: 0.7rem; color: var(--accent-cyan); }

        .mp-controls { display: flex; gap: 15px; align-items: center; }
        .mp-btn { background: none; border: none; color: #fff; font-size: 1.1rem; cursor: pointer; }
        .mp-btn-main { color: var(--accent-cyan); font-size: 1.3rem; }
        .mp-dl { color: #888; font-size: 1rem; text-decoration: none; display: flex; align-items: center; transition: 0.2s; }
        .mp-dl:hover { color: #fff; }

        .toast {
            position: absolute; top: 90px; left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(10, 10, 15, 0.95); border: 1px solid var(--accent-cyan);
            padding: 10px 20px; border-radius: 50px; display: flex; align-items: center; gap: 10px;
            color: #fff; font-weight: 600; font-size: 0.9rem;
            opacity: 0; visibility: hidden; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000; width: max-content; max-width: 90%;
        }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .toast i { color: var(--accent-cyan); }

        .status-msg { text-align: center; padding: 30px; color: #777; font-family: 'Courier Prime'; font-size: 0.8rem; }
        .loading-spinner { font-size: 1.8rem; color: var(--primary-purple); animation: spin 1s infinite linear; }
    </style>
</head>
<body>

    <div class="app-container">

        <header>
            <div class="header-title">Music simple InuuTyzDev</div>
        </header>

        <div class="main-content" id="main-content">
            <div class="glass-card anim-element delay-1" id="search-card">
                <div class="input-group">
                    <input type="text" class="input-box" id="search-input" placeholder="Search song or artist...">
                    <button class="search-btn" onclick="searchMusic()"><i class="fa-solid fa-search"></i></button>
                </div>
            </div>

            <div id="loading" class="status-msg" style="display: none;">
                <i class="fa-solid fa-circle-notch loading-spinner"></i>
                <p style="margin-top: 10px;">Menghubungkan ke Server KuroNeko...</p>
            </div>

            <div class="song-list" id="song-list">
                <div class="status-msg anim-element delay-2">Mulai dengan mencari lagu favoritmu...</div>
            </div>
        </div>

        <div class="mini-player" id="mini-player">
            <img src="https://via.placeholder.com/50" class="mp-img" id="mp-img">
            <div class="mp-info">
                <div class="mp-title" id="mp-title">Select Song</div>
                <div class="mp-artist" id="mp-artist">...</div>
            </div>
            <div class="mp-controls">
                <button class="mp-btn mp-btn-main" onclick="togglePlay()">
                    <i class="fa-solid fa-play" id="play-icon"></i>
                </button>
                <a href="#" class="mp-dl" id="mp-dl" download target="_blank">
                    <i class="fa-solid fa-download"></i>
                </a>
            </div>
            <audio id="audio-player" playsinline preload="auto"></audio>
        </div>

        <div class="toast" id="toast">
            <i class="fa-solid fa-info-circle"></i>
            <span id="toast-msg">Message here</span>
        </div>
    </div>

    <script>
        // ========== UTILS ==========
        const utils = {
            toast: (msg) => {
                const t = document.getElementById('toast');
                document.getElementById('toast-msg').innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3000);
            }
        };

        function escAttr(str) {
            return str ? str.replace(/'/g, "&#39;").replace(/"/g, "&quot;") : "";
        }

        // ========== PLAYER VARIABLES & MEDIA SESSION ==========
        const audio = document.getElementById('audio-player');
        const mpImg = document.getElementById('mp-img');
        const playIcon = document.getElementById('play-icon');
        const miniPlayer = document.getElementById('mini-player');

        function setupMediaSession() {
            if (!('mediaSession' in navigator)) return;
            navigator.mediaSession.setActionHandler('play', () => {
                audio.play().catch(e => console.log('MediaSession play error:', e));
                updatePlaybackState(true);
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                audio.pause();
                updatePlaybackState(false);
            });
            audio.addEventListener('ended', () => updatePlaybackState(false));
        }

        function updateMediaMetadata(title, artist, artwork) {
            if (!('mediaSession' in navigator)) return;
            navigator.mediaSession.metadata = new MediaMetadata({
                title, artist, album: 'KuroNeko Music',
                artwork: [{ src: artwork, sizes: '300x300', type: 'image/jpeg' }]
            });
        }

        function updatePlaybackState(isPlaying) {
            if (!('mediaSession' in navigator)) return;
            navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
        }

        function playSong(url, title, artist, img) {
            if (!url) return utils.toast("Audio tidak tersedia");
            audio.src = url; audio.load();
            document.getElementById('mp-title').innerText = title;
            document.getElementById('mp-artist').innerText = artist;
            document.getElementById('mp-img').src = img;
            document.getElementById('mp-dl').href = url; // Set link download asli
            
            miniPlayer.classList.add('active');
            mpImg.classList.add('playing');
            playIcon.className = "fa-solid fa-pause";
            
            updateMediaMetadata(title, artist, img);
            
            audio.play().then(() => updatePlaybackState(true)).catch(() => {
                updatePlaybackState(false);
                mpImg.classList.remove('playing');
                playIcon.className = "fa-solid fa-play";
                utils.toast("Gagal memutar audio otomatis.");
            });
        }

        function togglePlay() {
            if (audio.paused) {
                if (audio.src) {
                    audio.play().then(() => {
                        playIcon.className = "fa-solid fa-pause";
                        mpImg.classList.add('playing');
                        updatePlaybackState(true);
                    }).catch(e => console.log(e));
                }
            } else {
                audio.pause();
                playIcon.className = "fa-solid fa-play";
                mpImg.classList.remove('playing');
                updatePlaybackState(false);
            }
        }

        audio.addEventListener('ended', () => {
            playIcon.className = "fa-solid fa-play";
            mpImg.classList.remove('playing');
            updatePlaybackState(false);
        });

// ========== API LOGIC: FETCH DOWNLOAD URL SEBELUM PLAY ==========
async function loadAndPlay(spotifyUrl, title, artist, img) {
    if (!spotifyUrl) return utils.toast("Link Spotify tidak valid!");

    // Tampilkan state loading di mini player
    document.getElementById('mp-title').innerText = "Loading audio...";
    document.getElementById('mp-artist').innerText = "Mengambil data...";
    document.getElementById('mp-img').src = img;
    miniPlayer.classList.add('active');
    utils.toast("Meminta file MP3 ke server KuroNeko...");

    try {
        // Fetch ke API Download InuuTyzDev
        const res = await fetch(`https://api.inuutyz.web.id/api/download/spotify?url=${encodeURIComponent(spotifyUrl)}`);
        const data = await res.json();

        // Validasi struktur JSON berdasarkan output API Download-mu
        if (!data.status || !data.result || !data.result.result || !data.result.result.download) {
            throw new Error("Format data download tidak sesuai atau API gagal mengambil link MP3.");
        }

        // Ekstrak link download MP3 secara spesifik
        const audioUrl = data.result.result.download.url;

        if (!audioUrl) throw new Error("Audio URL kosong");

        // Putar lagu setelah URL MP3 didapat
        playSong(audioUrl, title, artist, img);

    } catch (e) {
        console.error(e);
        utils.toast("Gagal memuat audio dari server.");
        document.getElementById('mp-title').innerText = "Error memuat lagu";
        document.getElementById('mp-artist').innerText = title;
    }
}


        // ========== SEARCH LOGIC ==========
async function searchMusic() {
    const query = document.getElementById('search-input').value.trim();
    const list = document.getElementById('song-list');
    const loading = document.getElementById('loading');
    
    if (!query) return utils.toast("Masukkan judul lagu!");
    
    list.innerHTML = '';
    loading.style.display = 'block';
    document.getElementById('search-input').blur();

    try {
        // Fetch ke API Search InuuTyzDev
        const res = await fetch(`https://api.inuutyz.web.id/api/search/spotify?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        loading.style.display = 'none';

        // Validasi struktur JSON berdasarkan API KuroNeko
        if (!data.status || !data.result || !data.result.result) {
            list.innerHTML = '<div class="status-msg">Format data tidak sesuai atau lagu tidak ditemukan.</div>';
            return;
        }

        // Array hasil pencarian ada di data.result.result
        const results = data.result.result;

        if (results.length === 0) {
            list.innerHTML = '<div class="status-msg">Tidak ada hasil ditemukan.</div>';
            return;
        }

        results.forEach((song, index) => {
            // Parsing data secara spesifik sesuai JSON dari API-mu
            
            // 1. Ambil URL gambar dari album.images (ambil resolusi paling kecil/menengah di index 0)
            const artwork = (song.album && song.album.images && song.album.images.length > 0) 
                ? song.album.images[0].url 
                : 'https://via.placeholder.com/300';
                
            // 2. Ambil judul lagu
            const title = song.name || 'Unknown Title';
            
            // 3. Ambil nama artis dari array artists index ke-0
            const artist = (song.artists && song.artists.length > 0) 
                ? song.artists[0].name 
                : 'Unknown Artist';
                
            // 4. Ambil URL Spotify
            const spotifyUrl = song.url;

            const card = document.createElement('div');
            card.className = 'song-item anim-element';
            card.style.animationDelay = `${index * 0.05}s`;
            
            // Ketika diklik, panggil loadAndPlay dengan data dari search
            card.innerHTML = `
                <img src="${artwork}" class="song-img" onclick="loadAndPlay('${spotifyUrl}','${escAttr(title)}','${escAttr(artist)}','${artwork}')">
                <div class="song-info" onclick="loadAndPlay('${spotifyUrl}','${escAttr(title)}','${escAttr(artist)}','${artwork}')">
                    <div class="song-title">${title}</div>
                    <div class="song-artist">${artist}</div>
                </div>
            `;
            list.appendChild(card);
        });
        
    } catch (e) {
        loading.style.display = 'none';
        // Menampilkan pesan error asli agar mudah di-debug (terutama jika masalahnya adalah CORS atau Local File)
        list.innerHTML = `<div class="status-msg" style="color:#ff5555;">Koneksi Error: ${e.message}</div>`;
        console.error(e);
    }
}


        // ========== INIT ==========
        window.addEventListener('load', () => {
            setupMediaSession();
        });
    </script>
</body>
</html>
