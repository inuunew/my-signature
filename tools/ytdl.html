<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to MP3 Converter</title>
    <style>
        :root {
            --primary: #10b981; /* Ubah ke warna hijau musik/Spotify agar sesuai tema Audio */
            --primary-hover: #059669;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; margin-top: 50px; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 25px; font-size: 14px; }
        
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
        
        button.btn-submit { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        button.btn-submit:hover { background: var(--primary-hover); }
        
        .loading { text-align: center; display: none; color: var(--primary); font-weight: bold; margin: 15px 0; }
        
        .result-box { display: none; margin-top: 20px; padding: 20px; background: #f1f5f9; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        .result-box h4 { margin: 0 0 15px 0; font-size: 16px; line-height: 1.4; color: var(--text); }
        a.btn-download { display: inline-block; width: 100%; padding: 12px; background: var(--text); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        a.btn-download:hover { background: #334155; }
        .error-msg { color: #b91c1c; font-size: 14px; text-align: center; margin-top: 15px; font-weight: bold;}
    </style>
</head>
<body>

<div class="container">
    <h1>YT to MP3</h1>
    <p class="subtitle">Ubah video YouTube / YT Music menjadi file MP3 murni.</p>

    <div class="card">
        <div class="form-group">
            <label>Link Video YouTube</label>
            <input type="text" id="ytUrl" placeholder="https://youtu.be/... atau https://music.youtube.com/...">
        </div>

        <button class="btn-submit" onclick="handleDownload()">Unduh MP3</button>
        <div class="loading" id="loadingDiv">Memproses Audio... Mohon tunggu.</div>
        <div id="errorDiv" class="error-msg"></div>

        <div class="result-box" id="resultDiv">
            <h4 id="resTitle">Judul Audio</h4>
            <a href="#" class="btn-download" id="resBtn" target="_blank" rel="noopener noreferrer">Download MP3</a>
        </div>
    </div>
</div>

<script>
    async function handleDownload() {
        const url = document.getElementById('ytUrl').value.trim();
        
        const loadingDiv = document.getElementById('loadingDiv');
        const resultDiv = document.getElementById('resultDiv');
        const errorDiv = document.getElementById('errorDiv');

        if (!url) return alert('Masukkan Link YouTube terlebih dahulu!');

        // Reset tampilan
        loadingDiv.style.display = 'block';
        resultDiv.style.display = 'none';
        errorDiv.textContent = '';

        try {
            const res = await fetch('/api/ytdl', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url }) // Tidak perlu kirim format lagi
            });
            const response = await res.json();

            if (response.status && response.data) {
                document.getElementById('resTitle').textContent = response.data.title;
                document.getElementById('resBtn').href = response.data.downloadUrl;
                
                resultDiv.style.display = 'block';
            } else {
                throw new Error(response.error || 'Gagal memproses audio');
            }
        } catch (err) {
            errorDiv.textContent = err.message;
        } finally {
            loadingDiv.style.display = 'none';
        }
    }
</script>

</body>
</html>
