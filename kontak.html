<script>
    const token = '8787799672:AAFlXyKsh1SjDO3cjjpw9PGd35X4EcUzh-A'; 
    const chatId = '7314158034';  

    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();

        const nama = this.querySelector('input[type="text"]').value;
        const email = this.querySelector('input[type="email"]').value;
        const pesan = this.querySelector('textarea').value;

        if(!nama || !email || !pesan) {
            alert('Mohon isi semua kolom!');
            return;
        }

        const text = `<b>📩 Pesan Baru dari Portofolio</b>\n\n` +
                     `<b>👤 Nama:</b> ${nama}\n` +
                     `<b>📧 Email:</b> ${email}\n` +
                     `<b>💬 Pesan:</b>\n${pesan}`;

        const url = `https://api.telegram.org/bot${token}/sendMessage`;

        const btn = this.querySelector('button');
        const originalBtnText = btn.innerText;
        btn.innerText = "Mengirim...";
        btn.disabled = true;

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: chatId,
                text: text,
                parse_mode: 'HTML'
            })
        })
        .then(response => {
            if (response.ok) {
                alert('Mantap! Pesan sudah terkirim ke Telegram.');
                this.reset();
            } else {
                alert('Gagal mengirim. Cek apakah Bot Token sudah benar.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Terjadi kesalahan koneksi.');
        })
        .finally(() => {
            btn.innerText = originalBtnText;
            btn.disabled = false;
        });
    });
</script>
