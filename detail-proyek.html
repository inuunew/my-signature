<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail Proyek | InuuTyzDev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 antialiased min-w-[1280px] overflow-x-auto pt-24">

    <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
        <div class="flex justify-between items-center py-5 px-16 max-w-7xl mx-auto">
            <div class="text-2xl font-black tracking-tighter text-gray-950">Developer Modal Ai</div>
            <div class="flex items-center space-x-10 text-sm font-semibold text-gray-500">
                <a href="index.html" class="hover:text-gray-950 transition">Beranda</a>
                <a href="tentang.html" class="hover:text-gray-950 transition">Tentang</a>
                <a href="proyek.html" class="hover:text-gray-950 transition font-bold">Proyek</a>
                <a href="blog.html" class="hover:text-gray-950 transition">Blog</a>
            </div>
            <a href="kontak.html" class="bg-gray-950 text-white px-7 py-3 rounded-full text-xs font-bold transition">Hubungi Saya</a>
        </div>
    </nav>

    <main id="root-detail" class="max-w-5xl mx-auto px-16 py-16">
        <div class="animate-pulse flex flex-col items-center">
            <div class="h-10 bg-gray-100 w-1/2 rounded mb-8"></div>
            <div class="h-96 bg-gray-100 w-full rounded-[50px]"></div>
        </div>
    </main>

    <div class="text-center pb-32">
        <a href="proyek.html" class="bg-gray-950 text-white px-10 py-4 rounded-full font-bold hover:bg-gray-800 transition">
           <i class="fas fa-arrow-left mr-3"></i> Kembali ke Semua Proyek
        </a>
    </div>

    <script src="database-proyek.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const idProyek = params.get('id');
        const proyek = databaseProyek.find(p => p.id === idProyek);
        const root = document.getElementById('root-detail');

        if (proyek) {
            root.innerHTML = `
                <div class="text-center mb-16">
                    <h1 class="text-5xl font-black text-gray-900">${proyek.nama}</h1>
                </div>

                <div style="background-color: ${proyek.warna}" class="w-full h-96 rounded-[50px] flex items-center justify-center p-16 shadow-2xl mb-20 text-center relative border border-gray-100">
                    <div class="absolute top-0 left-0 w-full bg-white/90 backdrop-blur-sm h-12 flex items-center px-8 space-x-2 border-b border-gray-200 z-10 rounded-t-[50px]">
                        <div class="w-3 h-3 rounded-full bg-red-400"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                        <div class="w-3 h-3 rounded-full bg-green-400"></div>
                    </div>
                    <h2 class="text-5xl font-black text-white leading-tight drop-shadow-lg mt-8">${proyek.nama}</h2>
                </div>

                <div class="grid grid-cols-3 gap-20">
                    <div class="space-y-10">
                        <div>
                            <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2">Klien</h4>
                            <p class="text-xl font-bold">${proyek.klien}</p>
                        </div>
                        <div>
                            <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2">Tanggal</h4>
                            <p class="text-xl font-bold">${proyek.tanggal}</p>
                        </div>
                        <div>
                            <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2">Layanan</h4>
                            <p class="text-xl font-bold">${proyek.layanan}</p>
                        </div>
                        <div>
                            <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4">Fitur Utama</h4>
                            <div class="flex flex-wrap gap-2">
                                ${proyek.fitur.map(f => `<span class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-[10px] font-bold">${f}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="col-span-2">
                        <h2 class="text-3xl font-black mb-6">Tentang Proyek</h2>
                        <p class="text-gray-500 text-lg leading-relaxed mb-12">${proyek.deskripsi}</p>
                        
                        <div class="flex space-x-4">
                            <a href="${proyek.linkPreview}" target="_blank" class="bg-gray-950 text-white px-10 py-5 rounded-full font-bold flex items-center space-x-3 hover:bg-gray-800 transition shadow-lg">
                                <i class="fas fa-external-link-alt text-sm"></i>
                                <span>Buka Aplikasi Web</span>
                            </a>
                        </div>
                    </div>
                </div>
            `;
            // Set Page Title
            document.title = `${proyek.nama} | InuuTyzDev`;
        } else {
            root.innerHTML = `<h1 class="text-center text-4xl font-bold">Proyek tidak ditemukan.</h1>`;
        }
    </script>
</body>
</html>
