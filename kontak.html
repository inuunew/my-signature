<script>
    const token = '8787799672:AAFlXyKsh1SjDO3cjjpw9PGd35X4EcUzh-A'; // Ganti dengan Token Bot Anda
    const chatId = '7314158034';   // Ganti dengan Chat ID Anda

    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();

        // Ambil data dari input
        const nama = document.querySelector('input[placeholder="John Doe"]').value;
        const email = document.querySelector('input[placeholder="john@example.com"]').value;
        const pesan = document.querySelector('textarea').value;

        // Format pesan yang akan muncul di Telegram
        const text = `<b>Ada Pesan Baru!</b>\n\n` +
                     `<b>Nama:</b> ${nama}\n` +
                     `<b>Email:</b> ${email}\n` +
                     `<b>Pesan:</b> ${pesan}`;

        const url = `https://api.telegram.org/bot${token}/sendMessage`;

        // Kirim data menggunakan Fetch API
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: chatId,
                text: text,
                parse_mode: 'HTML'
            })
        })
        .then(response => {
            if (response.ok) {
                alert('Pesan berhasil terkirim!');
                this.reset(); // Kosongkan form
            } else {
                alert('Gagal mengirim pesan.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Terjadi kesalahan koneksi.');
        });
    });
</script>
