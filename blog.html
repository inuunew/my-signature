<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Semua Artikel | InuuTyzDev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 antialiased min-w-[1280px] overflow-x-auto pt-24">

    <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
        <div class="flex justify-between items-center py-5 px-16 max-w-7xl mx-auto">
            <div class="text-2xl font-black tracking-tighter text-gray-950">Developer Modal Ai</div>
            <div class="flex items-center space-x-10 text-sm font-semibold text-gray-500">
                <a href="index.html" class="hover:text-gray-950 transition">Beranda</a>
                <a href="tentang.html" class="hover:text-gray-950 transition">Tentang</a>
                <a href="proyek.html" class="hover:text-gray-950 transition">Proyek</a>
                <a href="blog.html" class="text-gray-950 transition font-bold">Blog</a>
            </div>
            <a href="kontak.html" class="bg-gray-950 text-white px-7 py-3 rounded-full text-xs font-bold hover:bg-gray-800 transition">Hubungi Saya</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-16 pt-16 pb-12 text-center">
        <h1 class="text-5xl font-black text-gray-900 mb-4">Semua Artikel</h1>
        <p class="text-gray-500 text-sm">Kumpulan Artikel Terbaru</p>
    </div>

    <div class="max-w-7xl mx-auto px-16 mb-12 flex justify-between items-center">
        <div class="relative w-96">
            <i class="fas fa-search absolute left-5 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="Cari judul artikel..." class="w-full pl-12 pr-4 py-3 bg-gray-50 rounded-full border border-gray-200 focus:outline-none focus:border-gray-950 text-sm transition-all">
        </div>
        <div class="flex space-x-2" id="filterContainer">
            <button onclick="filterBlog('Semua')" class="filter-btn bg-gray-950 text-white px-6 py-2.5 rounded-full text-sm font-semibold">Semua</button>
            <button onclick="filterBlog('Teknologi')" class="filter-btn text-gray-500 hover:text-gray-950 px-6 py-2.5 rounded-full text-sm font-semibold transition">Teknologi</button>
            <button onclick="filterBlog('Tips')" class="filter-btn text-gray-500 hover:text-gray-950 px-6 py-2.5 rounded-full text-sm font-semibold transition">Tips</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-16 pb-32">
        <div id="container-blog" class="grid grid-cols-3 gap-8">
            </div>
        <div id="no-results" class="hidden text-center py-20 text-gray-400 font-medium">
            Artikel tidak ditemukan...
        </div>
    </div>

    <script src="database-blog.js"></script>

    <script>
        const container = document.getElementById('container-blog');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('no-results');

        function renderBlog(data) {
            container.innerHTML = "";
            if (data.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                data.forEach(post => {
                    container.innerHTML += `
                        <div class="bg-white rounded-[35px] overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-500 border border-gray-100 group">
                            <div style="background-color: ${post.warna}" class="h-52 flex items-center justify-center p-10 text-center text-white font-black text-2xl relative">
                                <span class="absolute top-5 right-8 text-[10px] tracking-[0.2em] uppercase opacity-60 font-bold">${post.kategori}</span>
                                <h3 class="leading-tight">${post.judulBanner}</h3>
                            </div>
                            <div class="p-10">
                                <div class="flex items-center space-x-4 mb-5 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                                    <span>${post.tanggal}</span><span>•</span><span>${post.durasi}</span>
                                </div>
                                <h4 class="text-xl font-bold mb-4 text-gray-900 group-hover:text-gray-700 transition">${post.judulArtikel}</h4>
                                <p class="text-gray-400 text-sm mb-10 leading-relaxed">${post.deskripsi}</p>
                                <a href="artikel.html?id=${post.id}" class="w-full py-4 border border-gray-100 rounded-2xl text-[10px] font-bold uppercase tracking-widest text-gray-400 group-hover:bg-gray-950 group-hover:text-white group-hover:border-gray-950 transition-all flex items-center justify-center space-x-3">
                                    <span>Baca Selengkapnya</span>
                                    <i class="fas fa-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    `;
                });
            }
        }

        // Fungsi Cari
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = databaseBlog.filter(p => p.judulArtikel.toLowerCase().includes(val));
            renderBlog(filtered);
        });

        // Fungsi Filter Kategori
        function filterBlog(cat) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-gray-950', 'text-white');
                btn.classList.add('text-gray-500');
            });
            event.target.classList.add('bg-gray-950', 'text-white');

            if (cat === 'Semua') {
                renderBlog(databaseBlog);
            } else {
                const filtered = databaseBlog.filter(p => p.kategori === cat);
                renderBlog(filtered);
            }
        }

        // Render pertama kali
        renderBlog(databaseBlog);
    </script>
</body>
</html>
