<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Semua Proyek | InuuTyzDev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 antialiased min-w-[1280px] overflow-x-auto pt-24">

    <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
        <div class="flex justify-between items-center py-5 px-16 max-w-7xl mx-auto">
            <div class="text-2xl font-black tracking-tighter text-gray-950">Developer Modal Ai</div>
            <div class="flex items-center space-x-10 text-sm font-semibold text-gray-500">
                <a href="index.html" class="hover:text-gray-950 transition">Beranda</a>
                <a href="tentang.html" class="hover:text-gray-950 transition">Tentang</a>
                <a href="proyek.html" class="text-gray-950 transition font-bold">Proyek</a>
                <a href="blog.html" class="hover:text-gray-950 transition">Blog</a>
            </div>
            <a href="kontak.html" class="bg-gray-950 text-white px-7 py-3 rounded-full text-xs font-bold hover:bg-gray-800 transition shadow-sm">
                Hubungi Saya
            </a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-16 pt-16 pb-12 text-center">
        <h1 class="text-5xl font-black text-gray-900 mb-4">Semua Proyek</h1>
        <p class="text-gray-500">Berikut adalah kumpulan proyek yang pernah saya handle.</p>
    </div>

    <div class="max-w-7xl mx-auto px-16 mb-12 flex justify-between items-center">
        <div class="relative w-96">
            <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchProyek" placeholder="Cari proyek atau layanan..." class="w-full pl-12 pr-4 py-3 bg-gray-50 rounded-full border border-gray-200 focus:outline-none focus:border-gray-950 text-sm transition-all">
        </div>
        <div class="flex space-x-2" id="filterContainer">
            <button onclick="filterProyek('Semua')" class="filter-btn bg-gray-950 text-white px-6 py-2.5 rounded-full text-sm font-semibold transition">Semua</button>
            <button onclick="filterProyek('Website')" class="filter-btn text-gray-500 hover:text-gray-950 px-6 py-2.5 rounded-full text-sm font-semibold transition">Website</button>
            <button onclick="filterProyek('Mobile App')" class="filter-btn text-gray-500 hover:text-gray-950 px-6 py-2.5 rounded-full text-sm font-semibold transition">Mobile App</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-16 pb-32">
        <div id="grid-proyek" class="grid grid-cols-3 gap-10">
            </div>
    </div>

    <script src="database-proyek.js"></script>
    
    <script>
        const gridContainer = document.getElementById('grid-proyek');
        const searchInput = document.getElementById('searchProyek');

        // FUNGSI RENDER
        function renderProyek(data) {
            gridContainer.innerHTML = ""; 
            
            if (data.length === 0) {
                gridContainer.innerHTML = `<div class="col-span-3 text-center py-20 text-gray-400 font-medium">Data proyek tidak ditemukan...</div>`;
                return;
            }

            data.forEach(proyek => {
                const card = `
                    <div class="bg-white rounded-[35px] overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-500 border border-gray-100 group flex flex-col">
                        
                        <div style="background-color: ${proyek.warna}" class="h-52 flex items-center justify-center p-10 text-center text-white font-black text-2xl relative">
                            <span class="absolute top-5 right-8 text-[10px] tracking-[0.2em] uppercase opacity-60 font-bold">${proyek.layanan}</span>
                            <h3 class="leading-tight drop-shadow-sm">${proyek.nama}</h3>
                        </div>

                        <div class="p-10 flex flex-col flex-grow">
                            
                            <div class="flex items-center space-x-4 mb-5 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                                <span>${proyek.tanggal}</span><span>•</span><span class="truncate">${proyek.klien}</span>
                            </div>
                            
                            <h4 class="text-xl font-bold mb-4 text-gray-900 group-hover:text-gray-700 transition">${proyek.nama}</h4>
                            <p class="text-gray-400 text-sm mb-10 leading-relaxed flex-grow">${proyek.deskripsi}</p>
                            
                            <a href="detail-proyek.html?id=${proyek.id}" class="w-full mt-auto py-4 bg-gray-950 text-white rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:bg-gray-800 transition-all flex items-center justify-center space-x-3 shadow-md">
                                <span>Lihat Detail</span>
                                <i class="fas fa-arrow-right"></i>
                            </a>

                        </div>
                    </div>
                `;
                gridContainer.innerHTML += card;
            });
        }

        // FUNGSI PENCARIAN (SEARCH)
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filteredData = databaseProyek.filter(p => 
                p.nama.toLowerCase().includes(val) || 
                p.layanan.toLowerCase().includes(val)
            );
            renderProyek(filteredData);
        });

        // FUNGSI FILTER TOMBOL KATEGORI
        function filterProyek(kategori) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-gray-950', 'text-white');
                btn.classList.add('text-gray-500', 'hover:text-gray-950');
            });
            event.target.classList.remove('text-gray-500', 'hover:text-gray-950');
            event.target.classList.add('bg-gray-950', 'text-white');

            if (kategori === 'Semua') {
                renderProyek(databaseProyek);
            } 
            else if (kategori === 'Website') {
                const filtered = databaseProyek.filter(p => 
                    p.layanan.toLowerCase().includes('web') || 
                    p.layanan.toLowerCase().includes('tool') || 
                    p.layanan.toLowerCase().includes('utility')
                );
                renderProyek(filtered);
            } 
            else if (kategori === 'Mobile App') {
                const filtered = databaseProyek.filter(p => 
                    p.layanan.toLowerCase().includes('mobile') || 
                    p.layanan.toLowerCase().includes('app')
                );
                renderProyek(filtered);
            }
        }

        // Render saat halaman dibuka
        renderProyek(databaseProyek);
    </script>
</body>
</html>
