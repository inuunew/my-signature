<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APKMODY Downloader</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
        }
        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        button {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: var(--primary-dark); }
        .loading {
            text-align: center;
            display: none;
            margin: 20px 0;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }
        .card {
            background: var(--card);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }
        .card-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .card-title {
            font-size: 15px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }
        .card-version {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 12px;
            flex: 1;
        }
        .detail-card {
            display: none;
            background: var(--card);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .detail-header {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }
        .detail-header img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
        }
        .dl-item {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-back {
            background: #6b7280;
            margin-bottom: 15px;
        }
        .error {
            color: #dc2626;
            background: #fee2e2;
            padding: 12px;
            border-radius: 6px;
            display: none;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>APKMODY Downloader</h1>

    <div class="search-form">
        <input type="text" id="searchInput" placeholder="Cari game/aplikasi atau masukkan URL APKMODY...">
        <button onclick="handleSubmit()">Cari</button>
    </div>

    <div class="error" id="error"></div>
    <div class="loading" id="loading">Memuat data dari server...</div>

    <!-- Hasil Search -->
    <div class="grid" id="results"></div>

    <!-- Detail & File Download -->
    <div class="detail-card" id="detail">
        <button class="btn-back" onclick="showResults()">⬅ Kembali</button>
        <div class="detail-header" id="detailHeader"></div>
        <h3>Daftar File Download:</h3>
        <div id="downloadList"></div>
    </div>
</div>

<script>
    async function handleSubmit() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        showLoading(true);
        hideError();
        hideDetail();

        try {
            if (query.startsWith('http')) {
                await loadDetail(query);
            } else {
                await loadSearch(query);
            }
        } catch (err) {
            showError(err.message);
        } finally {
            showLoading(false);
        }
    }

    async function loadSearch(q) {
        const res = await fetch(`/api/apkmody?action=search&q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Gagal mencari');

        const container = document.getElementById('results');
        container.innerHTML = '';
        container.style.display = 'grid';

        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<p>Hasil tidak ditemukan.</p>';
            return;
        }

        data.items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${item.cover || 'https://via.placeholder.com/200'}" alt="cover">
                <div class="card-content">
                    <div class="card-title">${item.title}</div>
                    <div class="card-version">${item.version}</div>
                    <button onclick="loadDetail('${item.url}')">Detail & Download</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function loadDetail(url) {
        showLoading(true);
        hideError();
        try {
            const res = await fetch(`/api/apkmody?action=detail&url=${encodeURIComponent(url)}`);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Gagal memuat detail');

            document.getElementById('results').style.display = 'none';
            const detailCard = document.getElementById('detail');
            detailCard.style.display = 'block';

            document.getElementById('detailHeader').innerHTML = `
                <img src="${data.icon || 'https://via.placeholder.com/80'}" alt="icon">
                <div>
                    <h2 style="margin:0;">${data.title}</h2>
                    <small>Versi: ${data.version || '-'} | Mod: ${data.mod || '-'}</small>
                </div>
            `;

            const dlContainer = document.getElementById('downloadList');
            dlContainer.innerHTML = '';

            if (!data.downloads || data.downloads.length === 0) {
                dlContainer.innerHTML = '<p style="color:red;">File download tidak ditemukan.</p>';
            } else {
                data.downloads.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'dl-item';
                    item.innerHTML = `
                        <div>
                            <strong>${file.fileName}</strong><br>
                            <small>Ukuran: ${file.size || 'N/A'}</small>
                        </div>
                        <a href="${file.url}" target="_blank" style="background:var(--primary);color:white;padding:8px 12px;border-radius:6px;text-decoration:none;font-weight:bold;">Unduh</a>
                    `;
                    dlContainer.appendChild(item);
                });
            }
        } catch (err) {
            showError(err.message);
        } finally {
            showLoading(false);
        }
    }

    function showLoading(v) { document.getElementById('loading').style.display = v ? 'block' : 'none'; }
    function showError(msg) { 
        const e = document.getElementById('error');
        e.style.display = 'block';
        e.textContent = msg;
    }
    function hideError() { document.getElementById('error').style.display = 'none'; }
    function hideDetail() { document.getElementById('detail').style.display = 'none'; }
    function showResults() {
        document.getElementById('detail').style.display = 'none';
        document.getElementById('results').style.display = 'grid';
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSubmit();
    });
</script>

</body>
</html>
