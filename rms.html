<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CFOP Lab – Belajar Rubik 3x3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fd;--ink:#15203b;--mute:#66728d;--line:#e2e8f5;--acc:#4560ff;--acc2:#e9edff;--ok:#0f9d6a;--no:#e5484d;--card:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{max-width:1080px;margin:0 auto;padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 45deg,#ffd500,#ff7a00,#d62a2a,#1c5cff,#00a650,#ffd500)}
.stat{font-size:13px;font-weight:700;color:var(--acc);background:var(--acc2);border-radius:99px;padding:6px 12px}
.app{max-width:1080px;margin:0 auto;padding:6px 16px 110px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;background:linear-gradient(165deg,#e8eeff,#fff 75%);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(52,78,180,.14);overflow:hidden}
#cv{display:block;width:100%;height:26vh;min-height:160px;touch-action:none;cursor:grab}
.ctl{display:flex;gap:4px;align-items:center;padding:6px 8px;flex-wrap:nowrap}
.ctl button{font-weight:700;font-size:13px;background:var(--acc2);color:var(--acc);border:0;border-radius:10px;padding:6px 9px;min-height:38px;white-space:nowrap}
.ctl button.go{background:var(--acc);color:#fff;min-width:60px}
.ctl label{flex:1;min-width:0;display:flex;align-items:center}
.ctl input{width:100%;min-width:40px;accent-color:var(--acc)}
#cap{padding:0 14px 2px;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#not{padding:2px 12px 10px;font:500 14px "IBM Plex Mono",ui-monospace,monospace;white-space:nowrap;overflow-x:auto}
#not span{display:inline-block;padding:2px 6px;border-radius:6px;color:#a2abc2}
#not span.done{color:var(--ink)}
#not span.cur{background:var(--acc);color:#fff}
body[data-page=puzzle] .ctl,body[data-page=puzzle] #not,body[data-page=solve] .ctl,body[data-page=solve] #not{display:none}
body[data-page=puzzle] #cap,body[data-page=solve] #cap{padding-bottom:10px}
#vt{display:none;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;color:var(--acc)}
body[data-page=solve] .stage.big #vt{display:block}
body[data-page=riwayat] .stage,body[data-page=timer] .stage{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;min-height:40px;font-weight:700;box-shadow:0 2px 6px rgba(52,78,180,.07)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(52,78,180,.07)}
h2{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
h3{margin:18px 0 8px;font-size:17px}
.card p{margin:0 0 8px;color:var(--mute);max-width:60ch}
.card ol{margin:0;padding-left:20px;max-width:60ch}
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}
.row[aria-pressed="true"]{border-color:var(--acc);background:var(--acc2)}
.th{width:76px;height:76px;flex:none;border-radius:12px;background:#eef2ff}
.tx{min-width:0;flex:1}
.row b{display:flex;gap:8px;align-items:center;font-size:17px}
.row code,.hrow code,.res code{display:block;margin:2px 0;font:500 14px "IBM Plex Mono",ui-monospace,monospace;color:var(--acc);overflow-wrap:anywhere}
.row small,.hrow small{color:var(--mute);font-size:14px}
em{font-style:normal;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px}
em.ok{background:#e1f7ee;color:var(--ok)}
em.no{background:#ffe9ea;color:var(--no)}
.btn{border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;padding:10px 18px;min-height:46px}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn.sm{min-height:38px;padding:6px 14px;flex:none}
.meter{height:8px;border-radius:99px;background:var(--acc2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:var(--acc);border-radius:inherit;transition:width .2s}
.mrow{font-size:14px;color:var(--mute);margin-top:10px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.pad button{font:600 17px "IBM Plex Mono",ui-monospace,monospace;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:0 2px 6px rgba(52,78,180,.08)}
.pad button:active{background:var(--acc2);transform:scale(.97)}
details{margin:6px 0}
summary{cursor:pointer;font-weight:700;color:var(--acc);padding:6px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.res{border-radius:20px;padding:16px;margin-bottom:12px}
.res.win{background:#e6f8ef;border:1px solid #b5ebd2}
.res.lose{background:#fff0f0;border:1px solid #ffd0d3}
.res b{font-size:20px;display:block;margin-bottom:4px}
.res p{margin:0 0 8px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sum div{background:var(--acc2);border-radius:14px;padding:10px;text-align:center}
.sum b{display:block;font-size:24px;color:var(--acc)}
.sum span{font-size:13px;color:var(--mute)}
.hrow{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.hrow>div{min-width:0}
.hb{display:grid;gap:6px;flex:none}
.empty{color:var(--mute);margin:0 0 8px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:600px;margin:0 auto;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bnav button{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:8px 1px;min-height:58px;font-size:11px;font-weight:700;color:var(--mute);box-shadow:0 6px 18px rgba(52,78,180,.16)}
.bnav button[aria-current="page"]{background:var(--acc);border-color:var(--acc);color:#fff}
.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:860px){.app{grid-template-columns:420px minmax(0,1fr);align-items:start}.stage{top:16px}#cv{height:360px}body[data-page=riwayat] .app,body[data-page=timer] .app{grid-template-columns:minmax(0,720px);justify-content:center}}
.bigbtn{position:absolute;top:8px;right:8px;z-index:2;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--acc)}
.bigbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modebtn{position:absolute;top:8px;left:8px;z-index:2;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.92);font-weight:700;font-size:13px;color:var(--acc)}
.bigbar{display:none;justify-content:space-between;align-items:center;padding:10px 12px}
.stage.big{position:fixed;inset:0;top:0;z-index:50;border-radius:0;border:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(165deg,#e8eeff,#fff 75%)}
.stage.big .bigbar{display:flex;order:-1}
.stage.big #cv{flex:1;height:auto;min-height:0}
.stage.big .ctl,.stage.big #not,.stage.big .bigbtn{display:none}
.stage.big #cap{padding:8px 14px 14px;text-align:center;font-size:14px}
.tpad{user-select:none;-webkit-user-select:none;touch-action:none;background:var(--card);border:2px solid var(--line);border-radius:24px;min-height:32vh;display:grid;place-content:center;text-align:center;gap:8px;margin-bottom:12px;box-shadow:0 4px 16px rgba(52,78,180,.07)}
#ttime{font-weight:800;font-size:clamp(52px,17vw,88px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tpad small{color:var(--mute);font-size:14px}
.tpad[data-s=hold]{background:#fff0f0;border-color:#ffb4b8}
.tpad[data-s=ready]{background:#e6f8ef;border-color:#7fdcb2}
.tpad[data-s=run]{background:var(--acc2);border-color:var(--acc)}
.tpad[data-s=insp]{background:#fff8e6;border-color:#ffd77a}
.sum.four{grid-template-columns:repeat(4,1fr);margin-bottom:6px}
.sum.four b{font-size:17px}
.scr small{color:var(--mute);font-size:13px}
.scr code{display:block;font:500 15px "IBM Plex Mono",ui-monospace,monospace;overflow-wrap:anywhere;margin:2px 0 10px}
body.bigon{overflow:hidden}
body:not([data-page=puzzle]) #bUndo{visibility:hidden}
</style>
</head>
<body data-page="belajar">
<header class="top"><div class="brand"><span class="logo"></span>CFOP Lab</div><span class="stat" id="stat"></span></header>
<main class="app">
<section class="stage" id="stage" aria-label="Kubus 3D">
<canvas id="cv" aria-label="Kubus Rubik 3D. Geser stiker untuk memutar lapisan, geser area kosong untuk memutar sudut pandang."></canvas>
<button class="modebtn" id="bMode">Geser: Tampilan</button>
<button class="bigbtn" id="bBig" aria-label="Perbesar layar"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<div class="bigbar"><button class="btn sm" id="bClose">Tutup</button><span id="vt"></span><button class="btn sm ghost" id="bUndo">Urungkan</button></div>
<div class="ctl">
<button id="bReset">Ulang</button>
<button id="bBack">Mundur</button>
<button id="bPlay" class="go">Putar</button>
<button id="bNext">Maju</button>
<button id="bView">Atas</button>
<label><input id="sp" type="range" min="0.5" max="3" step="0.25" value="1" aria-label="Kecepatan animasi"></label>
</div>
<div id="cap"></div>
<div id="not"></div>
</section>
<section id="pg"></section>
</main>
<nav class="bnav" id="nav" aria-label="Halaman">
<button data-p="belajar" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 5.5v16"/></svg>Belajar</button>
<button data-p="puzzle" aria-current="false"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Teka-teki</button>
<button data-p="solve" aria-current="false"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Acak</button>
<button data-p="timer" aria-current="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 3h6"/></svg>Stopwatch</button>
<button data-p="riwayat" aria-current="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Riwayat</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TABS=[
{t:"Dasar",h:"Membaca notasi",p:"Setiap huruf adalah sisi yang diputar 90° searah jarum jam saat menghadap sisi itu. Tanda ' berarti berlawanan arah, angka 2 berarti putar 180°. Ketuk gerakan untuk melihatnya.",s:0,i:[
["R","R","Sisi kanan (Right)"],["R'","R'","Sisi kanan, berlawanan arah"],["U","U","Sisi atas (Up)"],["F","F","Sisi depan (Front)"],["L","L","Sisi kiri (Left)"],["D","D","Sisi bawah (Down)"],["B","B","Sisi belakang (Back)"],["R2","R2","Putar kanan 180°"],["M","M","Lapisan tengah, searah L"],["x","x","Putar seluruh kubus searah R"]]},
{t:"Cross",h:"1. Cross",p:"Bentuk tanda plus di satu sisi (biasanya putih) dengan warna samping yang cocok dengan titik tengahnya. Targetnya selesai dalam 8 gerakan atau kurang, tanpa rumus hafalan.",s:0,o:["Pilih sisi putih sebagai sisi bawah.","Cari empat sisi putih, bawa ke lapisan atas membentuk bunga (daisy).","Putar lapisan atas sampai warna samping cocok dengan titik tengah.","Putar 180° sisi itu (F2, R2, B2, L2) agar sisi putih turun ke bawah."],i:[
["Turunkan satu sisi","F2","Setelah warnanya cocok, putar 180° untuk memasukkan sisi putih."],["Turunkan keempat sisi","F2 R2 B2 L2","Dari daisy yang sudah cocok, selesaikan Cross."]]},
{t:"F2L",h:"2. F2L (First Two Layers)",p:"Pasangkan sudut dan sisi lapisan tengah, lalu sisipkan bersamaan ke slot. Ada 41 kasus; mulai dari beberapa kasus dasar ini. Kubus diacak dengan kebalikan rumus, jadi tekan Putar untuk memecahkannya.",s:1,i:[
["Sisip kanan","R U R'","Kasus paling dasar untuk slot kanan-depan."],["Sisip kiri","F' U' F","Cermin dari kasus kanan, untuk slot kiri-depan."],["Pasangan terpisah (kanan)","U R U' R'","Sudut dan sisi terpisah di lapisan atas; satukan lalu sisipkan."],["Pasangan terpisah (kiri)","U' F' U F","Cermin dari kasus sebelumnya."],["Sudut menghadap atas","R U2 R' U' R U R'","Kasus umum saat stiker sudut menghadap ke atas."],["Sexy move","R U R' U'","Dipakai berulang di banyak kasus F2L dan OLL."],["Sledgehammer","R' F R F'","Mengeluarkan pasangan yang terjebak di slot."]]},
{t:"OLL",h:"3. OLL (Orient Last Layer)",p:"Buat seluruh lapisan atas berwarna sama (kuning). Metode 2-look: pertama sisi (garis, L, atau titik), lalu sudut. Total 57 kasus penuh, tapi 2-look hanya perlu 10 rumus.",s:1,i:[
["Sisi: Garis","F R U R' U' F'","Dua sisi kuning membentuk garis."],["Sisi: Huruf L","F U R U' R' F'","Dua sisi kuning membentuk L."],["Sisi: Titik","F R U R' U' F' f R U R' U' f'","Tidak ada sisi kuning; gabungan Garis dan L."],["Sudut: Sune","R U R' U R U2 R'","Satu sudut kuning menghadap atas."],["Sudut: Anti-Sune","R U2 R' U' R U' R'","Cermin dari Sune."],["Sudut: H","F R U R' U' R U R' U' R U R' U' F'","Dua sudut menghadap samping di sisi berseberangan."],["Sudut: Pi","R U2 R2 U' R2 U' R2 U2 R","Pola seperti huruf π."],["Sudut: U","R2 D R' U2 R D' R' U2 R'","Dua sudut menghadap atas bersebelahan."],["Sudut: T","R U R' U' R' F R F'","Pola seperti huruf T."],["Sudut: L","F R' F' R U R U' R'","Pola seperti huruf L pada sudut."]]},
{t:"PLL",h:"4. PLL (Permute Last Layer)",p:"Susun posisi akhir potongan lapisan atas hingga kubus selesai. Total 21 kasus; mulai dari yang paling sering muncul.",s:1,i:[
["Ua","R U' R U R U R U' R' U' R2","Menukar tiga sisi, satu arah."],["Ub","R2 U R U R' U' R' U' R' U R'","Menukar tiga sisi, arah sebaliknya."],["H","M2 U M2 U2 M2 U M2","Menukar dua pasang sisi berseberangan."],["Z","M' U M2 U M2 U M' U2 M2","Menukar dua pasang sisi bersebelahan."],["Aa","x R' U R' D2 R U' R' D2 R2 x'","Menukar tiga sudut."],["Ab","x R2 D2 R U R' D2 R U' R x'","Menukar tiga sudut, arah sebaliknya."],["T","R U R' U' R' F R2 U' R' U' R U R' F'","Menukar dua sudut dan dua sisi."],["Y","F R U' R' U' R U R' F' R U R' U' R' F R F'","Menukar dua sudut diagonal dan dua sisi."],["Jb","R U R' F' R U R' U' R' F R2 U' R'","Menukar dua sudut dan dua sisi bersebelahan."],["Ra","R U' R' U' R U R D R' U' R D' R' U2 R'","Menukar dua sudut dan dua sisi."]]}
];

/* ---------- tabel lengkap dari panduan GAN ---------- */
const mk=(p,a,n)=>a.split("|").map((s,i)=>[p+String(i+1).padStart(2,"0"),s.trim(),n]);
TABS[2].p="41 kasus F2L dari tabel panduan. Pasangkan sudut dan sisi lalu sisipkan ke slot. Kubus diacak dengan kebalikan rumus, tekan Putar untuk memecahkannya.";

let mode="view",st=null;
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),AX=["x","y","z"];
function canMove(){
const pg=document.body.dataset.page;
if(pg=="puzzle")return !!pz&&!pz.done&&pz.n<pz.limit;
if(pg=="solve")return !!vs&&(vs.state=="armed"||vs.state=="run")&&$("stage").classList.contains("big");

cv.addEventListener("pointerdown",e=>{
if(!cube||moving||flipping||st)return;
cv.setPointerCapture(e.pointerId);
const r=cv.getBoundingClientRect();let hit=null;
if(mode=="layer"&&canMove()){
mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera);
hit=ray.intersectObjects(cubies,true)[0]||null;}
st={x:e.clientX,y:e.clientY,hit:hit,m:"pend",left:e.clientX-r.left<r.width/2,hist:[]};});
cv.addEventListener("pointermove",e=>{
if(!st)return;
const dx=e.clientX-st.x,dy=e.clientY-st.y;
if(st.m=="pend"){if(Math.hypot(dx,dy)<10)return;if(st.hit)layerStart(dx,dy);else flipStart(dx,dy);}
if(st.m=="layer"){
const proj=dx*st.tv[0]+dy*st.tv[1],n=performance.now();
st.th=proj/st.ppu*.5;st.piv.rotation[AX[st.ai]]=st.th;
st.hist.push([n,proj]);while(st.hist.length>1&&n-st.hist[0][0]>140)st.hist.shift();}});
function endDrag(){const S=st;st=null;if(S&&S.m=="layer")layerEnd(S);}
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);

function flipStart(dx,dy){
st.m="done";let ax,sg;
if(Math.abs(dx)>=Math.abs(dy)){ax=1;sg=dx>0?1:-1;}
else if(st.left){ax=0;sg=dy>0?1:-1;}
else{ax=2;sg=dy>0?-1:1;}
flipCube(ax,sg);}
function flipCube(ax,sg){
flipping=true;
const q0=cube.quaternion.clone(),v=new THREE.Vector3();v.setComponent(ax,1);
const q1=new THREE.Quaternion().setFromAxisAngle(v,sg*Math.PI/2).multiply(q0),t0=performance.now();
(function s(){const p=Math.min(1,(performance.now()-t0)/260),e=1-Math.pow(1-p,3);
cube.quaternion.copy(q0).slerp(q1,e);
if(p<1){requestAnimationFrame(s);return;}
const m=new THREE.Matrix4().makeRotationFromQuaternion(q1);m.elements=m.elements.map(Math.round);
cube.quaternion.setFromRotationMatrix(m);flipping=false;})();}

function layerStart(dx,dy){
const h=st.hit,c=h.object.parent,r=cv.getBoundingClientRect();
const rel=cube.worldToLocal(h.point.clone()).sub(c.position);
const ax=Math.abs(rel.x),ay=Math.abs(rel.y),az=Math.abs(rel.z);
const na=ax>=ay&&ax>=az?0:ay>=az?1:2;
const n=new THREE.Vector3();n.setComponent(na,rel.getComponent(na)>=0?1:-1);
const scr=v=>{const q=v.clone().project(camera);return [(q.x+1)/2*r.width,(1-q.y)/2*r.height];};
const s0=scr(h.point);let best=null;
for(let ai=0;ai<3;ai++){if(ai==na)continue;
const a=new THREE.Vector3();a.setComponent(ai,1);
const t=new THREE.Vector3().crossVectors(a,n).applyQuaternion(cube.quaternion).multiplyScalar(.6);
const s1=scr(h.point.clone().add(t)),vx=s1[0]-s0[0],vy=s1[1]-s0[1],len=Math.hypot(vx,vy)||1;
const dot=(vx*dx+vy*dy)/len;
if(!best||Math.abs(dot)>Math.abs(best.dot))best={ai:ai,dot:dot,tv:[vx/len,vy/len],ppu:len/.6};}
const layer=Math.round(c.position.getComponent(best.ai));
const cs=cubies.filter(q=>Math.round(q.position.getComponent(best.ai))==layer);
const piv=new THREE.Group();cube.add(piv);cs.forEach(q=>piv.attach(q));
Object.assign(st,{m:"layer",ai:best.ai,tv:best.tv,ppu:best.ppu,layer:layer,cs:cs,piv:piv,th:0});
moving++;}
function layerEnd(S){
const now=performance.now(),hh=S.hist.filter(p=>now-p[0]<160),Q=Math.PI/2;
const v=hh.length>1?(hh[hh.length-1][1]-hh[0][1])/Math.max(1,hh[hh.length-1][0]-hh[0][0]):0;
let q=Math.round(S.th/Q);
if(Math.abs(v)>.3){const d=v>0?1:-1;if(q*d<1)q=d;}
q=Math.max(-2,Math.min(2,q));
const from=S.th,to=q*Q,t0=performance.now(),dur=140+Math.abs(to-from)/Q*60;
(function s(){const p=Math.min(1,(performance.now()-t0)/dur),e=1-Math.pow(1-p,3);
S.piv.rotation[AX[S.ai]]=from+(to-from)*e;
if(p<1){requestAnimationFrame(s);return;}
S.piv.updateMatrixWorld(true);
S.cs.forEach(c=>{cube.attach(c);c.position.round();const m=new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);m.elements=m.elements.map(Math.round);c.quaternion.setFromRotationMatrix(m);});
cube.remove(S.piv);moving--;
if(q)moveDone(S,q);})();}
function moveDone(S,q){
const L=[["R","L","M"],["U","D","E"],["F","B","S"]][S.ai],f=S.layer==1?L[0]:S.layer==-1?L[1]:L[2];
const t=Math.abs(q)==2?f+"2":f+(q*SPEC[f][2]<0?"'":"");
const pg=document.body.dataset.page;
if(pg=="solve"){if($("stage").classList.contains("big"))vsMove(t,true);}
else if(pg=="puzzle")pzMove(t,true);}

/* ---------- gerakan ---------- */
const SPEC={R:["x",v=>v==1,-1],L:["x",v=>v==-1,1],U:["y",v=>v==1,-1],D:["y",v=>v==-1,1],F:["z",v=>v==1,-1],B:["z",v=>v==-1,1],
r:["x",v=>v>=0,-1],l:["x",v=>v<=0,1],u:["y",v=>v>=0,-1],d:["y",v=>v<=0,1],f:["z",v=>v>=0,-1],b:["z",v=>v<=0,1],
M:["x",v=>v==0,1],E:["y",v=>v==0,1],S:["z",v=>v==0,-1],x:["x",()=>true,-1],y:["y",()=>true,-1],z:["z",()=>true,-1]};
const parse=s=>s.trim().split(/\s+/).map(t=>({n:t,f:t[0],k:t.includes("2")?2:t.endsWith("'")?-1:1}));
const inv=m=>({n:m.k==2?m.n:m.n.endsWith("'")?m.f:m.f+"'",f:m.f,k:-m.k});

const _mc=()=>cube,_ms=()=>cubies;
function turn(m,dur,G,C){return new Promise(res=>{
const cube=G||_mc(),cubies=C||_ms(),cnt=!G;
if(!cube){res();return;}
if(cnt)moving++;
const [ax,pred,dir]=SPEC[m.f];
const layer=cubies.filter(c=>pred(Math.round(c.position[ax])));
const piv=new THREE.Group();cube.add(piv);layer.forEach(c=>piv.attach(c));
const tot=dir*m.k*Math.PI/2;
const fin=()=>{piv.rotation[ax]=tot;piv.updateMatrixWorld(true);
layer.forEach(c=>{cube.attach(c);c.position.round();
const mm=new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);
mm.elements=mm.elements.map(Math.round);c.quaternion.setFromRotationMatrix(mm);});
cube.remove(piv);if(cnt)moving--;res();};
if(!dur){fin();return;}
const t0=performance.now();
(function step(){const p=Math.min(1,(performance.now()-t0)/dur);
piv.rotation[ax]=tot*(p*p*(3-2*p));
if(p<1)requestAnimationFrame(step);else fin();})();
});}

function showTab(n){
tabIdx=n;const T=TABS[n];
$("pg").innerHTML='<div class="chips">'+TABS.map((t,i)=>'<button class="chip'+(i==n?" on":"")+'" data-tab="'+i+'">'+t.t+"</button>").join("")+'</div><div class="card"><h2>'+T.h+"</h2><p>"+T.p+"</p>"+(T.o?"<ol>"+T.o.map(s=>"<li>"+s+"</li>").join("")+"</ol>":"")+'</div><div class="list" id="pane">'+
T.i.map((r,i)=>{const k=key(n,i);return '<button class="row" data-row="'+i+'" aria-pressed="'+(cur&&cur.it===r)+'"><img class="th" alt="" width="76" height="76"><span class="tx"><b>'+r[0]+(H.solved[k]?'<em class="ok">Selesai</em>':H.failed[k]?'<em class="no">Belum bisa</em>':"")+"</b><code>"+r[1]+"</code><small>"+r[2]+"</small></span></button>";}).join("")+"</div>";
fillThumbs(n);}
async function rowClick(b){
const T=TABS[tabIdx];
$("pane").querySelectorAll(".row").forEach(x=>x.setAttribute("aria-pressed","false"));
b.setAttribute("aria-pressed","true");
await load(T.i[+b.dataset.row],T.s);setView(tabIdx==3?1:0);}
function openCase(t,i){
tabIdx=t;go("belajar",1);
const b=$("pane").children[i];if(b){rowClick(b);b.scrollIntoView({block:"center"});}}

/* ---------- halaman teka-teki ---------- */
function isSolved(){
const m={};
for(const c of cubies)for(const s of c.children){const d=s.userData.d;if(!d)continue;
const v=new THREE.Vector3(d[0],d[1],d[2]).applyQuaternion(c.quaternion);
const k=Math.round(v.x)+","+Math.round(v.y)+","+Math.round(v.z);(m[k]=m[k]||new Set()).add(s.userData.f);}
return Object.values(m).every(s=>s.size==1);}
function pzNew(){
const pool=[];for(let t=2;t<=4;t++)TABS[t].i.forEach((_,i)=>pool.push([t,i]));
let c;do{c=pool[Math.random()*pool.length|0];}while(key(c[0],c[1])==lastKey);
lastKey=key(c[0],c[1]);
pz={t:c[0],i:c[1],k:lastKey,it:TABS[c[0]].i[c[1]],hist:[],n:0,ap:0,done:0};
pz.limit=Math.max(12,parse(pz.it[1]).length*2);
pzShow();}
function pzShow(){
const P=pz;token++;playing=false;pq=Promise.resolve();
resetCube();parse(P.it[1]).reverse().forEach(m=>turn(inv(m),0));
P.hist.forEach(m=>turn(m,0));P.n=P.ap=P.hist.length;
setView(P.t==3?1:0);pzRender();pzCount();}
function pzPage(){pz?pzShow():pzNew();}
const BASIC="U U' R R' F F' L L' D D' B B'".split(" "),MORE="r r' l l' u u' d d' f f' b b' M M' E E' S S' x x' y y' z z'".split(" ");
const padH=a=>'<div class="pad">'+a.map(m=>'<button data-m="'+m+'">'+m+"</button>").join("")+"</div>";
function pzRender(){
const P=pz;let h='<div class="card"><h2>Teka-teki acak</h2><p>Kubus di atas adalah satu kasus <b>'+KIND[P.t]+"</b>. Selesaikan dengan rumus yang tepat sebelum jatah gerakan habis. Tombol Geser di pojok kubus mengganti mode: Lapisan untuk memutar satu lapisan, Tampilan untuk melihat dari sisi lain. Gerakan juga bisa lewat tombol di bawah.</p>"+
'<div class="mrow" id="pzc"></div><div class="meter"><i id="pzb"></i></div></div>';
if(P.done==1)h+='<div class="res win"><b>Berhasil!</b><p>Kamu menyelesaikan '+P.it[0]+" dengan "+P.n+" gerakan. Rumus aslinya:</p><code>"+P.it[1]+'</code><div class="acts"><button class="btn" data-a="next">Teka-teki berikutnya</button></div></div>';
else if(P.done==-1)h+='<div class="res lose"><b>Belum bisa? Belajar dulu</b><p>Kasus ini adalah '+P.it[0]+". Pelajari rumusnya, lalu coba lagi kasus yang sama atau ganti teka-teki.</p>"+'<div class="acts"><button class="btn" data-a="retry">Coba lagi</button><button class="btn" data-a="learn">Belajar rumus ini</button><button class="btn ghost" data-a="next">Teka-teki lain</button></div></div>';
else h+=padH(BASIC)+"<details><summary>Gerakan lanjutan</summary>"+padH(MORE)+'</details><div class="acts"><button class="btn ghost" data-a="undo">Urungkan</button><button class="btn ghost" data-a="giveup">Menyerah</button></div>';
$("pg").innerHTML=h;}
function pzCount(){
const P=pz;if(!P)return;
$("cap").textContent="Teka-teki "+KIND[P.t]+": gerakan "+P.n+" dari "+P.limit;
const c=$("pzc");if(c){c.textContent="Gerakan "+P.n+" dari "+P.limit;$("pzb").style.width=(100*P.n/P.limit)+"%";}}
function pzMove(t,done){
const P=pz;if(!P||P.done||P.n>=P.limit)return;
const mv=parse(t)[0];P.hist.push(mv);P.n++;pzCount();
const chk=()=>{if(pz!==P||P.done)return;P.ap++;if(isSolved())pzWin();else if(P.ap>=P.limit)pzFail();};
if(done)chk();else pq=pq.then(()=>pz===P?turn(mv,220):0).then(chk);}
function pzUndo(){
const P=pz;if(!P||P.done||!P.hist.length)return;
const mv=P.hist.pop();P.n--;pzCount();
pq=pq.then(()=>pz===P?turn(inv(mv),220):0).then(()=>{if(pz===P)P.ap--;});}
function pzWin(){const P=pz;bigOff();P.done=1;H.solved[P.k]=Date.now();delete H.failed[P.k];save();stat();pzRender();pzCount();}
function pzCase(t,i){lastKey=key(t,i);const it=TABS[t].i[i];
pz={t:t,i:i,k:lastKey,it:it,hist:[],n:0,ap:0,done:0,limit:Math.max(12,parse(it[1]).length*2)};go("puzzle");}
function pzRetry(){const P=pz;if(!P)return;P.hist=[];P.n=P.ap=0;P.done=0;pzShow();}
function pzFail(){const P=pz;if(P.done)return;bigOff();P.done=-1;
if(!H.solved[P.k])H.failed[P.k]={ts:Date.now(),n:((H.failed[P.k]||{}).n||0)+1};
save();stat();pzRender();pzCount();}

/* ---------- halaman riwayat ---------- */
function histPage(){
const f=Object.entries(H.failed).sort((a,b)=>b[1].ts-a[1].ts),s=Object.entries(H.solved).sort((a,b)=>b[1]-a[1]);
const row=(k,sub,btn)=>{const it=nameOf(k);return '<div class="hrow"><div><b>'+it[0]+"</b><code>"+it[1]+"</code><small>"+sub+'</small></div><div class="hb"><button class="btn sm" data-a="try:'+k+'">Coba lagi</button><button class="btn sm ghost" data-a="open:'+k+'">'+btn+"</button></div></div>";};
$("pg").innerHTML='<div class="card"><h2>Riwayat</h2><div class="sum"><div><b>'+s.length+"</b><span>selesai</span></div><div><b>"+f.length+"</b><span>belum selesai</span></div><div><b>"+(TOTAL-s.length)+"</b><span>tersisa</span></div></div></div>"+
"<h3>Belum terselesaikan</h3>"+(f.length?f.map(([k,v])=>row(k,"Gagal "+v.n+"x, terakhir "+ago(v.ts),"Belajar")).join(""):'<p class="empty">Belum ada. Coba teka-teki dulu.</p>')+
"<h3>Rumus yang sudah diselesaikan</h3>"+(s.length?s.map(([k,v])=>row(k,"Selesai "+ago(v),"Lihat")).join(""):'<p class="empty">Belum ada yang diselesaikan.</p>')+
(f.length||s.length?'<div class="acts"><button class="btn ghost" data-a="clearh">Hapus riwayat</button></div>':"");}

/* ---------- stopwatch ---------- */
let TM=[],tmScr="",tmInsp=false,tmSt="idle",tmT0=0,tmRaf=0,tmHold=0,tmReady=false,tmBlock=0,tmPrev="idle",tmInspEnd=0;
try{TM=JSON.parse(localStorage.getItem("cfop-t")||"[]");}catch(e){}
const tsave=()=>{try{localStorage.setItem("cfop-t",JSON.stringify(TM));}catch(e){}};
function scramble(){
const F=["U","D","R","L","F","B"],ax=m=>"UD".includes(m)?0:"RL".includes(m)?1:2,S=["","'","2"];
const o=[];let last=-1;
while(o.length<20){const m=F[Math.random()*6|0];if(ax(m)==last)continue;last=ax(m);o.push(m+S[Math.random()*3|0]);}
return o.join(" ");}
const fmt=ms=>{const c=Math.floor(ms/10),s=Math.floor(c/100),m=Math.floor(s/60);return (m?m+":"+String(s%60).padStart(2,"0"):s)+"."+String(c%100).padStart(2,"0");};
function avg(n){if(TM.length<n)return null;const a=TM.slice(0,n).map(x=>x.t).sort((p,q)=>p-q).slice(1,-1);return a.reduce((s,x)=>s+x,0)/a.length;}
function setPad(s){
const p=$("tpad");if(!p)return;p.dataset.s=s;
$("thint").textContent={idle:tmInsp?"Ketuk untuk mulai inspeksi":"Tahan untuk bersiap",hold:"Tahan...",ready:"Lepas untuk mulai",run:"Ketuk untuk berhenti",insp:"Tahan lalu lepas untuk mulai",done:"Tahan untuk solve baru"}[s];}
function timerPage(){
if(!tmScr)tmScr=scramble();
const best=TM.length?Math.min(...TM.map(x=>x.t)):null,f=x=>x==null?"-":fmt(x);
const rows=TM.slice(0,30).map((x,i)=>'<div class="hrow"><div><b>'+fmt(x.t)+"</b><small>"+ago(x.d)+", "+new Date(x.d).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})+'</small></div><button class="btn sm ghost" data-a="tdel:'+i+'">Hapus</button></div>').join("");
$("pg").innerHTML='<div class="card"><h2>Stopwatch</h2><p>Uji kecepatanmu di kubus asli. Tahan area waktu sampai hijau, lepas untuk mulai, ketuk lagi untuk berhenti.</p><div class="scr"><small>Acakan</small><code id="tscr">'+tmScr+'</code></div><div class="acts"><button class="btn sm ghost" data-a="tscr">Acakan baru</button><button class="btn sm ghost" data-a="tinsp">Inspeksi 15 detik: '+(tmInsp?"nyala":"mati")+"</button></div></div>"+
'<div class="tpad" id="tpad" data-s="idle"><div id="ttime">0.00</div><small id="thint"></small></div>'+
'<div class="sum four"><div><b>'+f(best)+"</b><span>terbaik</span></div><div><b>"+f(avg(5))+"</b><span>rata-rata 5</span></div><div><b>"+f(avg(12))+"</b><span>rata-rata 12</span></div><div><b>"+TM.length+"</b><span>solve</span></div></div>"+
"<h3>Solve terbaru</h3>"+(rows||'<p class="empty">Belum ada waktu. Mulai solve pertamamu.</p>')+(TM.length?'<div class="acts"><button class="btn ghost" data-a="tclear">Hapus semua</button></div>':"");
const p=$("tpad");p.addEventListener("pointerdown",tmDown);p.addEventListener("pointerup",tmUp);p.addEventListener("pointercancel",()=>{clearTimeout(tmHold);tmReady=false;setPad(tmSt=="run"?"run":tmPrev);});p.oncontextmenu=e=>e.preventDefault();
setPad(tmSt=="done"?"done":"idle");}
function tmDown(e){
e.preventDefault();
if(tmSt=="run"){tmFinish();tmBlock=1;return;}
if(tmSt=="done")tmSt="idle";
tmPrev=tmSt;tmReady=false;tmBlock=0;
if(tmSt=="idle")$("ttime").textContent="0.00";
setPad("hold");
if(!(tmSt=="idle"&&tmInsp))tmHold=setTimeout(()=>{tmReady=true;setPad("ready");},300);}
function tmUp(){
clearTimeout(tmHold);
if(tmBlock){tmBlock=0;return;}
if(tmReady){tmReady=false;tmStart();return;}
if(tmPrev=="idle"&&tmInsp){tmInspect();return;}
setPad(tmPrev);}
function tmStart(){
cancelAnimationFrame(tmRaf);tmSt="run";tmT0=performance.now();setPad("run");
(function tick(){const el=$("ttime");if(tmSt=="run"&&el){el.textContent=fmt(performance.now()-tmT0);tmRaf=requestAnimationFrame(tick);}})();}
function tmInspect(){
tmSt="insp";tmInspEnd=performance.now()+15000;setPad("insp");
(function tick(){const el=$("ttime");if(tmSt!="insp"||!el)return;const r=Math.ceil((tmInspEnd-performance.now())/1000);el.textContent=r>0?r:"Waktu habis";tmRaf=requestAnimationFrame(tick);})();}
function tmFinish(){
const t=Math.round(performance.now()-tmT0);cancelAnimationFrame(tmRaf);tmSt="done";
TM.unshift({t:t,s:tmScr,d:Date.now()});tsave();tmScr=scramble();
timerPage();$("ttime").textContent=fmt(t);setPad("done");}
function tmReset(){clearTimeout(tmHold);cancelAnimationFrame(tmRaf);tmSt="idle";tmReady=false;tmBlock=0;}

/* ---------- rubik teracak + timer layar penuh ---------- */
let vs=null,vq=Promise.resolve(),VS=[];
try{VS=JSON.parse(localStorage.getItem("cfop-v")||"[]");}catch(e){}
const vsave=()=>{try{localStorage.setItem("cfop-v",JSON.stringify(VS));}catch(e){}};
function avgV(n){if(VS.length<n)return null;const a=VS.slice(0,n).map(x=>x.t).sort((p,q)=>p-q).slice(1,-1);return a.reduce((s,x)=>s+x,0)/a.length;}
function vsPage(){if(!vs||vs.state=="done")vsNew();else vsShow();}
function vsNew(){vs={scr:scramble(),state:"ready",moves:0,t0:0,raf:0,res:null};vsShow();}
function vsShow(){
const V=vs;token++;playing=false;vq=Promise.resolve();cancelAnimationFrame(V.raf);V.state="ready";V.moves=0;
resetCube();parse(V.scr).forEach(m=>turn(m,0));
setView(0);$("vt").textContent="0.00";
$("cap").textContent="Rubik sudah diacak. Lihat dulu, lalu tekan Mulai.";
vsRender();}
function vsRender(){
const V=vs,best=VS.length?Math.min(...VS.map(x=>x.t)):null,f=x=>x==null?"-":fmt(x);
const rows=VS.slice(0,30).map((x,i)=>'<div class="hrow"><div><b>'+fmt(x.t)+"</b><small>"+x.m+" gerakan, "+ago(x.d)+'</small></div><button class="btn sm ghost" data-a="vdel:'+i+'">Hapus</button></div>').join("");
$("pg").innerHTML=(V.state=="done"?'<div class="res win"><b>Selesai: '+fmt(V.res.t)+"</b><p>"+V.res.m+' gerakan. Waktu tersimpan di riwayat.</p><div class="acts"><button class="btn" data-a="vnew">Acak baru</button></div></div>':
'<div class="card"><h2>Rubik teracak</h2><p>Kubus di atas sudah diacak. Lihat dulu sesuka hati. Saat kamu tekan Mulai, layar membesar dan waktu berjalan begitu lapisan pertama diputar. Waktu berhenti otomatis saat kubus selesai.</p><div class="scr"><small>Acakan (bisa ditiru di kubus asli)</small><code>'+V.scr+'</code></div><div class="acts"><button class="btn" data-a="vstart">Mulai</button><button class="btn ghost" data-a="vnew">Acak ulang</button></div></div>')+
'<div class="sum four"><div><b>'+f(best)+"</b><span>terbaik</span></div><div><b>"+f(avgV(5))+"</b><span>rata-rata 5</span></div><div><b>"+f(avgV(12))+"</b><span>rata-rata 12</span></div><div><b>"+VS.length+"</b><span>solve</span></div></div>"+
"<h3>Riwayat waktu</h3>"+(rows||'<p class="empty">Belum ada waktu. Tekan Mulai untuk solve pertamamu.</p>')+(VS.length?'<div class="acts"><button class="btn ghost" data-a="vclear">Hapus semua</button></div>':"");}
function vsStart(){
const V=vs;if(!V||V.state!="ready")return;
V.state="armed";V.moves=0;setMode("layer");bigOn();
$("vt").textContent="0.00";$("cap").textContent="Putar lapisan pertama untuk memulai waktu.";}
function vsMove(t,done){
const V=vs;if(!V||(V.state!="armed"&&V.state!="run"))return;
const mv=parse(t)[0];
if(V.state=="armed"){V.state="run";V.t0=performance.now();$("cap").textContent="Selesaikan kubusnya!";
(function tick(){if(vs===V&&V.state=="run"){$("vt").textContent=fmt(performance.now()-V.t0);V.raf=requestAnimationFrame(tick);}})();}
V.moves++;
const chk=()=>{if(vs===V&&V.state=="run"&&isSolved())vsFinish();};
if(done)chk();else vq=vq.then(()=>vs===V?turn(mv,200):0).then(chk);}
function vsFinish(){
const V=vs,t=Math.round(performance.now()-V.t0);cancelAnimationFrame(V.raf);
V.state="done";V.res={t:t,m:V.moves};
VS.unshift({t:t,s:V.scr,m:V.moves,d:Date.now()});vsave();
bigOff();$("cap").textContent="Selesai dalam "+fmt(t);vsRender();}
function closeBig(){bigOff();if(document.body.dataset.page=="solve")vsPage();}

/* ---------- event ---------- */
$("nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.p);};
$("pg").addEventListener("click",e=>{
const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.m)pzMove(d.m);
else if(d.tab!=null)showTab(+d.tab);
else if(d.row!=null)rowClick(b);
else if(d.a){const a=d.a;
if(a=="next")pzNew();else if(a=="retry")pzRetry();else if(a=="giveup")pzFail();else if(a=="undo")pzUndo();
else if(a=="learn")openCase(pz.t,pz.i);
else if(a=="clearh"){H={solved:{},failed:{}};save();stat();histPage();}
else if(a=="vstart")vsStart();
else if(a=="vnew")vsNew();
else if(a=="vclear"){VS=[];vsave();vsRender();}
else if(a.startsWith("vdel:")){VS.splice(+a.slice(5),1);vsave();vsRender();}
else if(a=="tscr"){tmScr=scramble();$("tscr").textContent=tmScr;}
else if(a=="tclear"){TM=[];tsave();timerPage();}
else if(a.startsWith("tdel:")){TM.splice(+a.slice(5),1);tsave();timerPage();}
else if(a=="tinsp"){tmInsp=!tmInsp;timerPage();}
else if(a.startsWith("try:")){const [t,i]=a.slice(4).split(":");pzCase(+t,+i);}
else if(a.startsWith("open:")){const [t,i]=a.slice(5).split(":");openCase(+t,+i);}}});
function bigOn(){$("stage").classList.add("big");document.body.classList.add("bigon");}
function bigOff(){
if(vs&&(vs.state=="armed"||vs.state=="run")&&$("stage").classList.contains("big")){cancelAnimationFrame(vs.raf);vs.state="ready";}
$("stage").classList.remove("big");document.body.classList.remove("bigon");}
function setMode(m){mode=m;const b=$("bMode");if(b)b.textContent=m=="view"?"Geser: Tampilan":"Geser: Lapisan";}
$("bMode").onclick=()=>setMode(mode=="view"?"layer":"view");
$("bBig").onclick=bigOn;$("bClose").onclick=closeBig;
$("bUndo").onclick=()=>{if(document.body.dataset.page=="puzzle")pzUndo();};
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeBig();});
stat();go("belajar",1);
load(TABS[0].i[0],0).then(play);
</script>
</body>
</html>
